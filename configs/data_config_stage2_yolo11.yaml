data:
  events_file: "D:/ChenMeng/Graduate_Student/Experiment_and_Data/Flare_with_without_CME_forecast/data/raw/events_training.xlsx"
  hdf5_path: "data/Solar_Flares_CME_dataset.h5"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  numeric_cache_dir: "data/processed_arrays"
  hdf5_image_source: "fits_cache"
  proposal_cache_path: "outputs/proposals/stage2_yolo11_proposals.json"

  modalities:
    magnetogram:
      enabled: true
      channels: 1
      resolution: [256, 256]
    euv_94:
      enabled: true
      channels: 1
      resolution: [256, 256]
    euv_171:
      enabled: true
      channels: 1
      resolution: [256, 256]
    euv_193:
      enabled: true
      channels: 1
      resolution: [256, 256]
    halpha:
      enabled: true
      channels: 1
      resolution: [256, 256]

  time:
    pre_event_hours: 6
    post_event_hours: 3
    cadence_minutes: 60

  max_activities: 5
  sequence_length: 9
  stride: 1
  forecast_horizon: 3

  runtime:
    hdf5_locking: false

  split_data_dir: "data/split_data"

  splits:
    split_method: "temporal"
    train_ratio: 0.7
    val_ratio: 0.2
    test_ratio: 0.1
    random_seed: 42

  preprocessing:
    handle_missing: "nearest"
    interpolation_order: 1
    cache_processed: true
    num_workers: 4
