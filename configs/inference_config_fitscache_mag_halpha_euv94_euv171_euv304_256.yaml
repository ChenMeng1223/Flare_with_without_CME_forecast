inference:
  windowing:
    window_size: 10
    stride: 10
    use_uncertainty: true
    modalities: ["magnetogram", "euv_94", "euv_171", "euv_304", "halpha"]

  thresholds:
    class0: 0.3
    class1: 0.3
    class2: 0.3

  bbox_processing:
    min_area: 1
    max_area_ratio: 0.35
    min_confidence: 0.15
    min_positive_confidence: 0.15
    min_event_probability: 0.05
    min_proposal_score: 0.03
    min_effective_size: 0.0
    nms_threshold: 0.65
    merge_iou_threshold: 0.80
    max_detections: 12
    detection_box_source: "proposal"
    allow_background_fallback: true

  time_processing:
    min_prediction_interval: 0.0167
    max_duration_hours: 1.5
    max_prediction_horizon: 48.0

  alert_thresholds:
    high_risk: 0.7
    medium_risk: 0.6
    low_risk: 0.3

uncertainty:
  methods: ["mc_dropout"]
  mc_dropout:
    num_samples: 10
    dropout_enabled: true
  ensemble:
    num_models: 5
    use_checkpoints: true
  quantification:
    confidence_level: 0.95
    use_bootstrap: false

model:
  type: "multimodal_transformer"
  input_size: [256, 256]
  sequence_length: 10
  num_classes: 3
  max_activities: 15
  use_physical_constraints: true

  modalities:
    magnetogram:
      channels: 1
      resolution: [256, 256]
    euv_94:
      channels: 1
      resolution: [256, 256]
    euv_171:
      channels: 1
      resolution: [256, 256]
    euv_304:
      channels: 1
      resolution: [256, 256]
    halpha:
      channels: 1
      resolution: [256, 256]

  transformer:
    hidden_dim: 256
    num_heads: 4
    num_layers: 3
    dropout: 0.1
    feedforward_dim: 1024

  stage2:
    context_scale: 2.0
    roi_source_mix:
      gt: 0.2
      jittered_gt: 0.3
      predicted: 0.5

  physics:
    magnetic_energy_weight: 0.1
    helicity_weight: 0.05
    energy_balance_weight: 0.1
    enabled_constraints: ["magnetic_energy", "helicity"]

output:
  format: "json"
  include_uncertainty: true
  include_visualizations: true
  save_predictions: true
  save_alerts: true

logging:
  level: "INFO"
  log_dir: "logs/inference"
